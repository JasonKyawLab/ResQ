    <g transform="translate(300 360) scale(7.6) translate(-54 -54.5)"><g fill="#FF3B30"><circle cx="37.3" cy="40" r="3"/><circle cx="47.2" cy="40" r="3"/><circle cx="56.9" cy="40" r="3"/><rect x="34.6" y="51.3" width="11" height="6" rx="3"/><rect x="48.6" y="51.3" width="11" height="6" rx="3"/><rect x="62.5" y="51.3" width="11" height="6" rx="3"/><circle cx="51.4" cy="68" r="3"/><circle cx="61" cy="68" r="3"/><circle cx="70.7" cy="68" r="3"/></g></g>
    <text x="590" y="330" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="150" font-weight="700">Res<tspan fill="#FF3B30">Q</tspan></text>
